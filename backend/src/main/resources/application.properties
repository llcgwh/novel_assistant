spring.application.name=novel-assistant

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/novel_writing
spring.datasource.username=postgres
spring.datasource.password=llcgwh
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Upload Directory Configuration
app.upload.dir=uploads

# Shared by covers, portraits, scenes, maps and world entries; matches image backups.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
# Discard a bounded oversized upload so clients can receive the JSON 413 response.
server.tomcat.max-swallow-size=16MB
